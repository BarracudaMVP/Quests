{% extends "base_cabinet.html" %}
{% block title %}Изменить бронирование — DeepPress{% endblock %}
{% set active_tab = 'bookings' %}

{% block content %}
<div class="profile-card">
  <h2>Изменить бронирование</h2>
  <div class="profile-field"><span class="field-label">Квест</span><span class="field-val">{{ quest.name }}</span></div>
  <div class="profile-field"><span class="field-label">Дата и время</span><span class="field-val">{{ booking.slot }}</span></div>
  <form method="POST" style="margin-top:24px">
    <div class="field">
      <label>Количество игроков ({{ quest.min_players }}–{{ quest.max_players }})</label>
      <input type="number" name="player_count"
             min="{{ quest.min_players }}" max="{{ quest.max_players }}"
             value="{{ booking.player_count }}" style="max-width:120px">
    </div>
    <div class="profile-actions">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="{{ url_for('my_bookings') }}" class="btn btn-outline">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
