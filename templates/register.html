<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — DeepPress</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="modal-page">
    <div class="modal-header">
      <a href="{{ url_for('index') }}" class="logo">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="DeepPress">
      </a>
    </div>
    <div class="modal-body">
      <div class="modal-card" style="max-width:480px">
        <a href="{{ url_for('index') }}" class="modal-close">✕</a>
        <h2>Регистрация</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alerts">
              {% for msg in messages %}<div class="alert">{{ msg }}</div>{% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="field">
            <label>Имя</label>
            <input type="text" name="first_name" placeholder="Ваше имя" required>
          </div>
          <div class="field">
            <label>Фамилия</label>
            <input type="text" name="second_name" placeholder="Ваша фамилия" required>
          </div>
          <div class="field">
            <label>Телефон</label>
            <input type="text" name="phone" placeholder="+7 (900) 000-00-00" data-phone required>
          </div>
          <div class="field">
            <label>Пароль</label>
            <div class="pw-wrap">
              <input type="password" name="password" placeholder="••••••••" required>
              <button type="button" class="pw-eye"
                      onmousedown="pwShow(this)" onmouseup="pwHide(this)"
                      onmouseleave="pwHide(this)" ontouchstart="pwShow(this)"
                      ontouchend="pwHide(this)" ontouchcancel="pwHide(this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="hint">Не менее 8 символов, хотя бы 1 латинская буква</span>
          </div>
          <div class="field">
            <label>Повторите пароль</label>
            <div class="pw-wrap">
              <input type="password" name="confirm_password" placeholder="••••••••" required>
              <button type="button" class="pw-eye"
                      onmousedown="pwShow(this)" onmouseup="pwHide(this)"
                      onmouseleave="pwHide(this)" ontouchstart="pwShow(this)"
                      ontouchend="pwHide(this)" ontouchcancel="pwHide(this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/pw-eye.js') }}"></script>
  <script src="{{ url_for('static', filename='js/phone-format.js') }}"></script>
</body>
</html>
