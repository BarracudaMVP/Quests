{% extends "base_cabinet.html" %}
{% block title %}Изменить отзыв — DeepPress{% endblock %}
{% set active_tab = 'reviews' %}

{% block content %}
<div class="profile-card">
  <h2>Изменить отзыв — {{ quest.name }}</h2>
  <form method="POST">
    <div class="field">
      <label>Текст отзыва</label>
      <textarea name="text" required>{{ review.text }}</textarea>
    </div>
    <div class="profile-actions">
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="{{ url_for('my_reviews') }}" class="btn btn-outline">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
